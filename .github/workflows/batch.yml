name: Auto Quant Batch Update

on:
  repository_dispatch:
    types: [trigger_batch_update]  # 👈 이 부분이 추가되어야 앱 버튼 클릭 시 연동됩니다!
  schedule:
    - cron: '*/30 * * * *'         # 30분마다 자동 실행
  workflow_dispatch:               # GitHub 웹에서 수동 실행

permissions:
  contents: write

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Offline Quality Tests
        run: |
          python -m unittest -v test_modules

      - name: Run Batch Update Script
        run: |
          python batch_update.py

      - name: Commit and Push Parquet Files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add quant_stocks.parquet quant_macro.parquet batch_status.json
          git commit -m "Auto update quant data [$(date)]" || exit 0
          git push
