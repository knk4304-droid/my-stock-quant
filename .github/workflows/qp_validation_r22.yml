name: Classic R22 outcome follow-up
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'
    - cron: '30 23 * * 0-4'
permissions:
  contents: write
concurrency:
  group: market-scan-v90
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests yfinance
      - run: python qp_weekly.py --validate-only
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market_scan_data/qp_weekly_slots.json
          if ! git diff --cached --quiet; then
            git commit -m 'Follow up Classic recommendation outcomes'
            git push
          fi
