name: Market scan v9
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'  # 평일 오전 8:30 KST
    - cron: '0 1 * * 1'       # 월요일 오전 10:00 KST (UTC 01:00)
    - cron: '0 2,4,6,8 * * 1-5'  # 평일 11:00/13:00/15:00/17:00 KST 순환 스캔
permissions:
  contents: write
concurrency:
  group: market-scan-v90
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install scanner dependencies
        run: pip install pandas numpy requests yfinance pykrx finance-datareader
      - name: Verify integrated release
        run: python release_verification.py
      - name: Scan next batch
        env:
          SCAN_BATCH_SIZE: '250'
          REVISIT_TOP_N: '25'
        run: python market_batch_v90.py
      - name: Save per-run ranking history
        run: python ranking_history.py
      - name: Record and follow up recommendation snapshots
        run: python recommendation_tracker.py
      - name: Validate 1/5/20-session forward outcomes
        env:
          VALIDATION_MAX_TICKERS: "40"
        run: python forward_validation_v95.py
      - name: Validate stored recommendation data
        run: python validation_smoke.py --data market_scan_data/recommendation_history.csv
      - name: Save scan results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A market_scan_data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update market scan data'
            git push
          fi
